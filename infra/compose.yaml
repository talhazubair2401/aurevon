# Local stack (MTS v2.1 §14). From the repository root:
#   docker compose -f infra/compose.yaml up --build
# Then open http://localhost:8080 (storefront), /staff/ (staff) and /api/v1/ (API).
name: aurevon

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.local
  # Simulated payment provider for local review (P-06 pending); never set in production.
  PAYMENTS_SANDBOX_ENABLED: "true"
  DJANGO_SECRET_KEY: local-development-only-not-a-secret
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
  DATABASE_URL: postgres://aurevon:aurevon@postgres:5432/aurevon
  REDIS_URL: redis://redis:6379/0
  SITE_URL: http://localhost:8080
  TRUSTED_PROXY_COUNT: "1" # the local Caddy proxy
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  # Publishing CMS content refreshes the storefront's cache at once (decision 0005). Local value, not a secret.
  STOREFRONT_INTERNAL_URL: http://storefront:3000
  STOREFRONT_REVALIDATE_SECRET: local-development-revalidate-key
  # Product images: a shared volume served by the proxy at /media/ locally; S3-compatible object storage in
  # production (P-10). MinIO no longer publishes official images, so it isn't used here.
  MEDIA_STORAGE: local
  MEDIA_ROOT: /media
  MEDIA_PRIVATE_ROOT: /media-private
  # 3D for shoppers stays off until V-01, V-02 and V-03 pass (decision 0007). CI's full-stack job turns it on
  # to test the storefront viewer; never set it on in staging or production before the validations pass.
  THREED_FOR_SHOPPERS: ${THREED_FOR_SHOPPERS:-false}

services:
  postgres:
    # Same major version as production (P-04). Revisit if P-10 selects a provider on another major version.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aurevon
      POSTGRES_PASSWORD: aurevon
      POSTGRES_DB: aurevon
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurevon -d aurevon"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    # Catches all outgoing email locally; web UI on http://localhost:8025
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  migrate:
    # Built once by the api service; migrate, worker and scheduler reuse the same image.
    image: aurevon-backend:local
    pull_policy: never
    # Migrations, then the demo catalogue and storefront content (local only; never production).
    command:
      ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_demo_catalog"]
    environment:
      <<: *backend-env
      ALLOW_DEMO_DATA: "true"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: aurevon-backend:local
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    environment: *backend-env
    volumes:
      - media-data:/media
      - media-private:/media-private
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    image: aurevon-backend:local
    pull_policy: never
    command: ["celery", "-A", "config", "worker", "--loglevel", "INFO"]
    environment: *backend-env
    volumes:
      - media-data:/media
      - media-private:/media-private
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  scheduler:
    image: aurevon-backend:local
    pull_policy: never
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "--loglevel",
        "INFO",
        "--schedule",
        "/tmp/celerybeat-schedule",
      ]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  storefront:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args: { APP: storefront }
    environment:
      PORT: "3000"
      # Server-side reads go straight to the API container (lib/api.ts).
      API_INTERNAL_URL: http://api:8000
      # Public address for canonical URLs, hreflang and the sitemap (M17). Never indexable outside production.
      SITE_URL: http://localhost:8080
      SITE_INDEXABLE: "false"
      STOREFRONT_REVALIDATE_SECRET: local-development-revalidate-key
    depends_on:
      api: { condition: service_healthy }

  staff:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args: { APP: staff }
    environment:
      PORT: "3001"

  proxy:
    image: caddy:2.10-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media-data:/srv/media:ro
    depends_on:
      api: { condition: service_healthy }
      storefront: { condition: service_started }
      staff: { condition: service_started }

volumes:
  media-data:
  media-private:
  postgres-data:
